name: Update Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run Real-Prober and Classifier
        run: python scripts/main_v2.py
        env:
          PYTHONUNBUFFERED: '1'
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "No node changes."
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
      - name: Purge jsDelivr CDN
        if: success()
        run: |
          repo="${GITHUB_REPOSITORY}"
          curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${repo}@main/output/v2ray.txt" || true
          curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${repo}@main/output/clash.yaml" || true
